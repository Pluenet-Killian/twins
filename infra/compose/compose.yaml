name: twins

services:
  database:
    image: docker.io/timescale/timescaledb-ha:pg18.4-ts2.27.1-oss@sha256:d6f4290fc413dcb0b477c64fc0c50cc12c42e93a1fc242dfbfdc4c770d0d0553
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TWINS_POSTGRES_DB:?Set TWINS_POSTGRES_DB}
      POSTGRES_USER: ${TWINS_POSTGRES_USER:?Set TWINS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TWINS_POSTGRES_PASSWORD:?Set TWINS_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${TWINS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - twins-postgres-data:/home/postgres/pgdata/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  twins-postgres-data:
